<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Subtle Top Glow -->
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="16" fill="url(#glowGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#334155" stroke-width="1.5"/>

  <!-- Architectural 'W' Luxury Monogram -->
  <path 
    d="M13 18 L23 46 L32 26 L41 46 L51 18" 
    stroke="url(#goldGrad)" 
    stroke-width="5.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Center Diamond Sparkle -->
  <polygon points="32,15 34.5,19 32,23 29.5,19" fill="#FDE68A"/>

  <!-- Base Stability Anchor Line -->
  <line x1="20" y1="49" x2="44" y2="49" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>